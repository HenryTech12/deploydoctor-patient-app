zerops:
  - setup: app
    build:
      base: nodejs@22
      buildCommands:
        - npm install
      deployFiles: ./
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: npm run start
      envSecrets:
        GREETING_NAME: DeployDoctor
      env:
        # Deliberately wrong: a hardcoded private hostname instead of the
        # db service's real resolved value — /db-ping fails to resolve it.
        DATABASE_URL: postgresql://postgres:postgres@db-primary-internal:5432/patient
  - setup: db
    run:
      base: postgresql@16
