zerops:
  - setup: app
    build:
      base: nodejs@22
      buildCommands:
        - npm install
      deployFiles: ./
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: node src/index.js
      envSecrets:
        GREETING_NAME: DeployDoctor
        # DATABASE_URL must be set via Zerops UI; do NOT commit the value here
  - setup: db
    run:
      base: postgresql@16
